<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Materiales</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="config.js"></script>

  <style>
    :root {
      --bg:#0b141d;
      --card:#14212d;
      --accent:#003366;
      --green:#27ae60;
      --red:#e74c3c;
      --blue:#60a5fa;
      --yellow:#f59e0b;
      --text:#ffffff;
      --muted:#a0aec0;
      --border:#2c3e50;
      --input:#0b141d;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:'Segoe UI',Arial,sans-serif;
      min-width:1050px;
    }

    header {
      background:var(--card);
      padding:10px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid var(--border);
      position:sticky;
      top:0;
      z-index:40;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:16px;
    }

    .logo {
      background:#fff;
      padding:5px 10px;
      border-radius:4px;
    }

    .logo img {
      height:32px;
      display:block;
    }

    h1 {
      margin:0;
      font-size:20px;
      font-weight:900;
      letter-spacing:.7px;
    }

    .btn-back {
      background:#34495e;
      color:#ffffff;
      border:none;
      border-radius:6px;
      padding:9px 14px;
      cursor:pointer;
      font-weight:900;
    }

    .btn-back:hover {
      background:var(--yellow);
      color:#1b1200;
    }

    .container {
      max-width:1750px;
      margin:18px auto;
      padding:0 18px 25px;
    }

    .panel-box {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:8px;
      padding:14px;
      box-shadow:0 4px 6px rgba(0,0,0,.28);
    }

    .filters {
      display:grid;
      grid-template-columns:100px 220px 160px 1fr 120px;
      gap:10px;
      align-items:end;
      border-bottom:1px solid var(--border);
      padding-bottom:14px;
      margin-bottom:12px;
    }

    .group {
      display:flex;
      flex-direction:column;
      gap:5px;
    }

    label {
      font-size:12px;
      color:var(--muted);
      font-weight:800;
    }

    input,
    select,
    textarea {
      width:100%;
      background:var(--input);
      color:#ffffff;
      border:1px solid var(--border);
      border-radius:5px;
      padding:9px 10px;
      outline:none;
      font-size:13px;
      font-weight:800;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color:var(--blue);
      box-shadow:0 0 0 2px rgba(96,165,250,.18);
    }

    .btn-clear {
      background:#34495e;
      color:#ffffff;
      border:1px solid var(--border);
      padding:9px 12px;
      border-radius:5px;
      cursor:pointer;
      font-weight:900;
    }

    .btn-clear:hover {
      background:var(--red);
      border-color:var(--red);
    }

    .table-responsive {
      overflow-x:auto;
    }

    table {
      width:100%;
      border-collapse:collapse;
    }

    th,
    td {
      padding:10px 11px;
      text-align:left;
      border-bottom:1px solid var(--border);
      font-size:13px;
      vertical-align:middle;
    }

    th {
      background:var(--accent);
      color:#ffffff;
      font-weight:900;
      white-space:nowrap;
    }

    tbody tr:hover {
      background:#665112;
    }

    .col-codigo { width:105px; white-space:nowrap; }
    .col-unidad { width:80px; text-align:center; }
    .col-cat { width:180px; }
    .col-foto { width:80px; text-align:center; }
    .col-obs { width:220px; }
    .col-actions { width:210px; text-align:center; }

    .foto-icon {
      width:34px;
      height:34px;
      margin:auto;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid #64748b;
      color:#94a3b8;
      background:#111827;
    }

    .foto-icon.ok {
      border-color:#2ecc71;
      color:#2ecc71;
      background:rgba(39,174,96,.14);
      box-shadow:0 0 10px rgba(39,174,96,.35);
    }

    .actions {
      display:flex;
      justify-content:center;
      gap:7px;
      white-space:nowrap;
    }

    .btn {
      border:none;
      border-radius:6px;
      height:36px;
      padding:0 12px;
      cursor:pointer;
      color:#ffffff;
      font-weight:900;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
    }

    .btn-edit { background:#2563eb; }
    .btn-photo { background:#27ae60; }
    .btn-photo.off { background:#64748b; }
    .btn:hover { background:var(--yellow); color:#1b1200; }

    .msg {
      text-align:center;
      padding:24px;
      color:#d8e2ee;
      font-weight:900;
    }

    .modal-bg {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.76);
      z-index:200;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .modal {
      width:100%;
      max-width:760px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:10px;
      box-shadow:0 12px 30px rgba(0,0,0,.55);
      padding:18px;
    }

    .modal h2 {
      margin:0 0 14px;
      padding-bottom:10px;
      border-bottom:1px solid var(--border);
      color:#ffffff;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:20px;
    }

    .grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px 16px;
    }

    .full {
      grid-column:1 / -1;
    }

    .readonly {
      background:#101a24;
      color:var(--blue);
      font-weight:900;
    }

    textarea {
      min-height:110px;
      resize:vertical;
      line-height:1.35;
    }

    .preview {
      min-height:170px;
      border:1px dashed var(--border);
      border-radius:9px;
      background:#0b141d;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#94a3b8;
      font-weight:900;
      overflow:hidden;
      padding:10px;
    }

    .preview img {
      max-width:100%;
      max-height:260px;
      object-fit:contain;
    }

    .modal-actions {
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-top:16px;
    }

    .btn-modal {
      border:none;
      border-radius:6px;
      padding:10px 18px;
      cursor:pointer;
      color:#ffffff;
      font-weight:900;
      min-width:110px;
    }

    .cancel { background:#34495e; }
    .save { background:#27ae60; }

    @media(max-width:1300px) {
      .filters {
        grid-template-columns:90px 190px 150px 1fr 110px;
      }
    }
  </style>
</head>

<body>
<header>
  <div class="brand">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/zelaya27/IMAGENES_AZ/main/UTCD%20Vertical.png" alt="Logo">
    </div>
    <h1>PANEL DE MATERIALES</h1>
  </div>

  <button class="btn-back" onclick="location.href='index.html'">
    <i class="fas fa-arrow-left"></i> Menú
  </button>
</header>

<div class="container">
  <div class="panel-box">
    <div class="filters">
      <div class="group">
        <label>Mostrar:</label>
        <select id="limitSelector" onchange="renderizarTabla()">
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="ALL">Todos</option>
        </select>
      </div>

      <div class="group">
        <label>Categoría:</label>
        <select id="filtroCategoria" onchange="renderizarTabla()">
          <option value="TODAS">Todas</option>
        </select>
      </div>

      <div class="group">
        <label>Foto:</label>
        <select id="filtroFoto" onchange="renderizarTabla()">
          <option value="TODOS">Todos</option>
          <option value="CON">Con foto</option>
          <option value="SIN">Sin foto</option>
        </select>
      </div>

      <div class="group">
        <label>Buscar:</label>
        <input id="buscarTexto" placeholder="Código o nombre de material..." oninput="renderizarTabla()">
      </div>

      <button class="btn-clear" onclick="limpiarFiltros()">
        <i class="fas fa-times-circle"></i> Limpiar
      </button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th class="col-codigo">Código</th>
            <th>Material</th>
            <th class="col-cat">Categoría</th>
            <th class="col-unidad">Unidad</th>
            <th class="col-foto">Foto</th>
            <th class="col-obs">Observación</th>
            <th class="col-actions">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla">
          <tr><td colspan="7" class="msg">Cargando materiales...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2><i class="fas fa-pen"></i> Editar material</h2>

    <input type="hidden" id="editCodigo">

    <div class="grid">
      <div>
        <label>Código</label>
        <input id="editCodigoView" class="readonly" readonly>
      </div>

      <div>
        <label>Unidad</label>
        <input id="editUnidad" class="readonly" readonly>
      </div>

      <div class="full">
        <label>Material</label>
        <input id="editNombre" class="readonly" readonly>
      </div>

      <div class="full">
        <label>Categoría</label>
        <input id="editCategoria" class="readonly" readonly>
      </div>

      <div class="full">
        <label>Observaciones</label>
        <textarea id="editObservaciones"></textarea>
      </div>

      <div class="full">
        <label>Imagen actual / nueva</label>
        <div id="preview" class="preview">Sin imagen</div>
      </div>

      <div class="full">
        <label>Cargar foto</label>
        <input id="inputImagen" type="file" accept="image/*" onchange="previsualizarImagen()">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-modal cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-modal save" onclick="guardarMaterial()">
        <i class="fas fa-save"></i> Guardar
      </button>
    </div>
  </div>
</div>

<script>
  let materiales = [];
  let categorias = [];
  let materialActual = null;
  let imagenBase64 = "";
  let imagenNombre = "";
  let imagenMimeType = "";

  document.addEventListener("DOMContentLoaded", cargarMateriales);

  async function cargarMateriales() {
    try {
      const resp = await fetch(CONFIG.URL_APPS_SCRIPT, {
        method: "POST",
        body: JSON.stringify({ action: "obtenerMateriales" })
      });

      const data = await resp.json();

      if (data.status !== "Éxito") {
        throw new Error(data.message || "No se pudo cargar materiales.");
      }

      materiales = data.materiales || [];
      categorias = data.categorias || [];
      cargarCategorias();
      renderizarTabla();

    } catch (error) {
      document.getElementById("tabla").innerHTML =
        '<tr><td colspan="7" class="msg" style="color:#ff8a8a;">Error: ' + escaparHTML(error.message) + '</td></tr>';
    }
  }

  function cargarCategorias() {
    const select = document.getElementById("filtroCategoria");
    select.innerHTML = '<option value="TODAS">Todas</option>';

    categorias.forEach(cat => {
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  }

  function renderizarTabla() {
    const tbody = document.getElementById("tabla");
    const texto = normalizar(document.getElementById("buscarTexto").value);
    const cat = document.getElementById("filtroCategoria").value;
    const foto = document.getElementById("filtroFoto").value;
    const limit = document.getElementById("limitSelector").value;

    let datos = materiales.filter(m => {
      const coincideTexto =
        normalizar(m.codigo).includes(texto) ||
        normalizar(m.nombreMaterial).includes(texto);

      const coincideCat = cat === "TODAS" || m.nombreTipoMaterial === cat;

      const tieneFoto = String(m.urlImagen || "").trim() !== "";

      const coincideFoto =
        foto === "TODOS" ||
        (foto === "CON" && tieneFoto) ||
        (foto === "SIN" && !tieneFoto);

      return coincideTexto && coincideCat && coincideFoto;
    });

    if (limit !== "ALL") {
      datos = datos.slice(0, parseInt(limit, 10));
    }

    if (!datos.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="msg">No hay materiales para mostrar.</td></tr>';
      return;
    }

    tbody.innerHTML = "";

    datos.forEach(m => {
      const tieneFoto = String(m.urlImagen || "").trim() !== "";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="col-codigo"><b>${escaparHTML(m.codigo)}</b></td>
        <td>${escaparHTML(m.nombreMaterial)}</td>
        <td>${escaparHTML(m.nombreTipoMaterial || "N/A")}</td>
        <td class="col-unidad">${escaparHTML(m.unidad || "")}</td>
        <td class="col-foto">
          <div class="foto-icon ${tieneFoto ? "ok" : ""}">
            <i class="fas fa-camera"></i>
          </div>
        </td>
        <td>${escaparHTML(m.observaciones || "")}</td>
        <td class="col-actions">
          <div class="actions">
            <button class="btn btn-photo ${tieneFoto ? "" : "off"}" onclick="verFoto('${escaparAtributo(m.urlImagen)}')">
              <i class="fas fa-image"></i> Foto
            </button>
            <button class="btn btn-edit" onclick="abrirEditar('${escaparAtributo(m.codigo)}')">
              <i class="fas fa-pen"></i> Editar
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function limpiarFiltros() {
    document.getElementById("buscarTexto").value = "";
    document.getElementById("filtroCategoria").value = "TODAS";
    document.getElementById("filtroFoto").value = "TODOS";
    document.getElementById("limitSelector").value = "10";
    renderizarTabla();
  }

  function abrirEditar(codigo) {
    materialActual = materiales.find(m => String(m.codigo) === String(codigo));

    if (!materialActual) {
      alert("No se encontró el material.");
      return;
    }

    imagenBase64 = "";
    imagenNombre = "";
    imagenMimeType = "";
    document.getElementById("inputImagen").value = "";

    document.getElementById("editCodigo").value = materialActual.codigo;
    document.getElementById("editCodigoView").value = materialActual.codigo;
    document.getElementById("editNombre").value = materialActual.nombreMaterial;
    document.getElementById("editCategoria").value = materialActual.nombreTipoMaterial;
    document.getElementById("editUnidad").value = materialActual.unidad;
    document.getElementById("editObservaciones").value = materialActual.observaciones || "";

    pintarPreview(materialActual.urlImagen);

    document.getElementById("modalBg").style.display = "flex";
  }

  function cerrarModal() {
    document.getElementById("modalBg").style.display = "none";
  }

  function pintarPreview(url) {
    const preview = document.getElementById("preview");

    if (url) {
      preview.innerHTML = `<img src="${escaparAtributo(url)}" alt="Imagen material">`;
    } else {
      preview.textContent = "Sin imagen";
    }
  }

  function previsualizarImagen() {
    const file = document.getElementById("inputImagen").files[0];
    if (!file) return;

    imagenNombre = file.name;
    imagenMimeType = file.type || "image/jpeg";

    const reader = new FileReader();

    reader.onload = function(e) {
      const result = e.target.result;
      imagenBase64 = String(result).split(",")[1] || "";
      document.getElementById("preview").innerHTML = `<img src="${result}" alt="Nueva imagen">`;
    };

    reader.readAsDataURL(file);
  }

  async function guardarMaterial() {
    if (!materialActual) return;

    const botones = document.querySelectorAll(".btn-modal");
    botones.forEach(b => b.disabled = true);

    try {
      const payload = {
        action: "actualizarMaterial",
        codigo: materialActual.codigo,
        observaciones: document.getElementById("editObservaciones").value,
        imagenBase64: imagenBase64,
        imagenNombre: imagenNombre,
        imagenMimeType: imagenMimeType
      };

      const resp = await fetch(CONFIG.URL_APPS_SCRIPT, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const data = await resp.json();

      if (data.status !== "Éxito") {
        throw new Error(data.message || "No se pudo guardar.");
      }

      alert("Material actualizado correctamente.");
      cerrarModal();
      await cargarMateriales();

    } catch (error) {
      alert("Error: " + error.message);
    } finally {
      botones.forEach(b => b.disabled = false);
    }
  }

  function verFoto(url) {
    if (!url) {
      alert("Este material no tiene foto.");
      return;
    }
    window.open(url, "_blank", "noopener");
  }

  function normalizar(v) {
    return String(v || "").trim().toUpperCase();
  }

  function escaparHTML(v) {
    return String(v || "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function escaparAtributo(v) {
    return escaparHTML(v).replace(/`/g,"&#096;");
  }
</script>
</body>
</html>
